version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flask-backend
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
    expose:
      - "5000"
    networks:
      - app-net

  nginx:
    image: nginx:latest
    container_name: reverse-proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
